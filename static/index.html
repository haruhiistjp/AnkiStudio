<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnkiStudio</title>
<style>
:root { --bg:#fafaf8; --side:#f2f1ec; --ink:#213547; --muted:#6b7280;
  --accent:#b3261e; --line:#e5e7eb; --card:#fff; --ok:#137a3c; --warn:#b26a00;
  --bad:#c23; --hov:#f7f7f4; }
html.dark { --hov:#26262b; --bg:#161619; --side:#1c1c20; --ink:#e5e7eb; --muted:#9ca3af;
  --accent:#e57373; --line:#2d2d33; --card:#202024; }
html.nord { --hov:#3b4252; --bg:#2e3440; --side:#292e39; --ink:#eceff4; --muted:#9aa5b8;
  --accent:#88c0d0; --line:#3b4252; --card:#353c4a; }
html.solar { --hov:#eee6d0; --bg:#fdf6e3; --side:#f3ecd8; --ink:#586e75; --muted:#93a1a1;
  --accent:#cb4b16; --line:#eee8d5; --card:#faf3e2; }
* { box-sizing: border-box; }
body { margin:0; font:15px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); background:var(--bg); }
#layout { display:grid; grid-template-columns:230px 1fr; min-height:100vh; }
#side { background:var(--side); border-right:1px solid var(--line); padding:14px 10px; }
#side h1 { font-size:16px; margin:2px 8px 14px; }
#side a { display:block; padding:8px 10px; border-radius:8px; color:var(--ink);
  text-decoration:none; font-size:14px; }
#side a.active { background:var(--line); font-weight:600; border-left:3px solid var(--accent); }
#side .sect { font-size:11px; color:var(--muted); text-transform:uppercase;
  letter-spacing:.05em; margin:14px 8px 4px; }
#view { padding:22px 26px; max-width:1060px; }
h2 { font-size:19px; margin:0 0 14px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px; margin-bottom:20px; }
.kpi { background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:12px; text-align:center; }
.kpi b { font-size:24px; display:block; } .kpi span { color:var(--muted); font-size:12px; }
table { width:100%; border-collapse:collapse; background:var(--card);
  border:1px solid var(--line); border-radius:10px; overflow:hidden; }
th { text-align:left; font-size:11.5px; text-transform:uppercase; color:var(--muted);
  padding:8px 10px; border-bottom:1px solid var(--line); }
td { padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
tr:hover td { background:var(--hov); }
tr[data-pv] { cursor:pointer; }
.jp { font-size:16px; }
.dim { color:var(--muted); font-size:12.5px; }
.bar { background:#e8e8e4; height:12px; border-radius:6px; overflow:hidden; min-width:60px; }
.bar i { display:block; height:100%; background:var(--accent); }
.bar.g i { background:var(--ok); }
button, .btn { border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
button.primary { background:var(--accent); color:#fff; border:none; }
button.ok { color:var(--ok); border-color:var(--ok); }
button.no { color:var(--bad); border-color:var(--bad); }
input, select { border:1px solid var(--line); border-radius:8px; padding:6px 10px;
  font-size:13px; background:var(--card); color:var(--ink); }
input::placeholder { color:var(--muted); }
select, option { background:var(--card); color:var(--ink); }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
.badge { display:inline-block; font-size:11px; border-radius:4px; padding:1px 6px;
  border:1px solid var(--line); color:var(--muted); }
.badge.appr { color:var(--ok); border-color:var(--ok); }
.badge.disc { color:var(--bad); border-color:var(--bad); }
.badge.drop { color:var(--warn); }
form.box { background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:16px; max-width:560px; }
form.box label { display:block; font-size:12.5px; color:var(--muted); margin:10px 0 3px; }
form.box input { width:100%; }
#msg { margin-top:10px; font-size:13px; color:var(--muted); min-height:18px; }
.pager { display:flex; gap:8px; align-items:center; margin-top:12px; }
.hint { color:var(--muted); font-size:12.5px; }
.check { width:16px; height:16px; }
#themeSel { margin:18px 8px 0; width:calc(100% - 16px); }
/* Anki-style card preview panel */
#preview { display:none; position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--side); border-top:2px solid var(--accent);
  box-shadow:0 -8px 30px rgba(0,0,0,.25); padding:12px 18px 16px; }
#preview.open { display:block; }
#preview .top { display:flex; gap:10px; align-items:center; margin-bottom:10px;
  flex-wrap:wrap; }
#preview .meta { color:var(--muted); font-size:12.5px; }
#preview .spacer { flex:1; }
.cardbox { background:var(--card); border:1px solid var(--line); border-radius:10px;
  max-width:640px; margin:0 auto; padding:26px 22px; text-align:center; min-height:150px; }
.cardbox .jp { font-size:26px; line-height:1.8; }
.cardbox .rd { color:var(--muted); font-size:15px; margin-top:8px; }
.cardbox .tr { font-size:16px; margin-top:14px; color:var(--ink); }
.cardbox .ex { font-size:14px; margin-top:14px; color:#6b7280;
  border-top:1px solid var(--line); padding-top:10px; white-space:pre-wrap; }
.cardbox img { max-width:420px; max-height:200px; border-radius:8px; margin-bottom:12px; }
.cardbox audio { display:block; margin:12px auto 0; width:100%; max-width:420px; }
.cardbox .front-label { font-size:10.5px; letter-spacing:.08em; color:var(--muted);
  text-transform:uppercase; margin-bottom:10px; }
#preview .note { text-align:center; color:var(--muted); font-size:11.5px; margin-top:8px; }
.pkname { font-size:12.5px; word-break:break-all; }
/* ---------- batch review ---------- */
#rv-card { background:var(--card); border:1px solid var(--line); border-radius:12px;
  max-width:680px; margin:0 auto; padding:26px 22px; text-align:center; min-height:220px; }
#rv-card .jp { font-size:28px; line-height:1.8; }
#rv-card .rd { color:var(--muted); font-size:15px; margin-top:8px; }
#rv-card .tr { font-size:17px; margin-top:12px; }
#rv-card img { max-width:440px; max-height:220px; border-radius:8px; margin-bottom:12px; }
#rv-card audio { display:block; margin:14px auto 0; width:100%; max-width:440px; }
#rv-meta { text-align:center; color:var(--muted); font-size:13px; margin:10px 0 18px; }
#rv-progress { display:flex; gap:6px; max-width:680px; margin:0 auto 16px; }
#rv-progress i { flex:1; height:6px; border-radius:3px; background:var(--line); }
#rv-progress i.ok { background:var(--ok); } #rv-progress i.no { background:var(--bad); }
#rv-keys { text-align:center; color:var(--muted); font-size:12.5px; margin-top:14px; }
#rv-keys b { color:var(--ink); }
/* ---------- deck view ---------- */
.deckgroup { background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:16px; }
.deckgroup h3 { margin:0 0 10px; font-size:15px; }
.deckgroup .balance { font-size:12px; color:var(--muted); margin-left:8px; }
.drow { display:flex; gap:8px; align-items:flex-start; padding:7px 0;
  border-top:1px solid var(--line); }
.drow .jp { flex:1; min-width:0; font-size:15.5px; }
.drow .meta { color:var(--muted); font-size:11.5px; }
.drow input.note { border:1px solid var(--line); border-radius:6px; background:var(--bg);
  color:var(--ink); font-size:12px; padding:4px 6px; width:220px; }
.drow button { padding:3px 8px; font-size:12px; }
.drow .mv { color:var(--accent); }

/* projects + deck redactor */
.projrow { display:flex; gap:10px; align-items:center; padding:12px;
  border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--card); }
.projrow.current { border-left:3px solid var(--accent); }
.projrow .info { flex:1; } .projrow .name { font-weight:600; font-size:14px; }
.projrow .meta { color:var(--muted); font-size:12px; }
.block { background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; margin-bottom:14px; }
.block h3 { margin:0 0 4px; font-size:15px; display:flex; align-items:baseline; gap:8px; }
.block .pattern { font-size:13px; color:var(--muted); }
.block .fillinfo { font-size:12px; color:var(--accent); margin-left:auto; }
.block.empty { opacity:.6; border-style:dashed; }
.block .cards { margin-top:10px; }

#ptmodal { display:none; position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.35); }
#ptmodal.open { display:flex; align-items:center; justify-content:center; }
#ptmodal .inner { background:var(--card); border:1px solid var(--line); border-radius:12px;
  min-width:360px; max-width:520px; max-height:70vh; display:flex; flex-direction:column; padding:14px; }
#ptmodal input { width:100%; margin-bottom:10px; }
#ptmodal .list { overflow-y:auto; flex:1; }
#ptmodal .list a { display:block; padding:6px 8px; border-radius:6px; cursor:pointer;
  text-decoration:none; color:var(--ink); font-size:13.5px; }
#ptmodal .list a:hover { background:var(--hov); }
#ptmodal .list .pid { color:var(--muted); font-size:11px; margin-right:6px; }
</style>
</head>
<body>
<div id="layout">
  <aside id="side">
    <h1>AnkiStudio</h1>
    <div class="sect">Project</div>
    <a data-view="projects">Projects</a>
    <div class="sect">Workbench</div>
    <a data-view="stats" class="active">Statistics</a>
    <a data-view="browse">Card browser</a>
    <div class="sect">Inputs</div>
    <a data-view="sources">Sources</a>
    <a data-view="lexicons">Lexicons</a>
    <a data-view="points">Grammar points</a>
    <a data-view="review">Batch review</a>
    <a data-view="deck">Deck</a>
    <a data-view="export">Export deck</a>
    <div class="sect">Setup</div>
    <a data-view="settings">Settings</a>
    <select id="themeSel" title="theme">
      <option value="auto">Auto theme</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="nord">Nord</option>
      <option value="solar">Solarized</option>
    </select>
  </aside>
  <main id="view"></main>
</div>
<div id="ptmodal"><div class="inner">
  <b>Move to grammar point</b>
  <input id="ptm-search" placeholder="search points…" autocomplete="off">
  <div class="list" id="ptm-list"></div>
  <div class="row" style="margin-top:10px"><button id="ptm-cancel">Cancel</button></div>
</div></div>
<div id="preview">
  <div class="top">
    <button class="primary" id="pv-flip">Show back</button>
    <button id="pv-close">✕ Close</button>
    <button id="pv-save" title="save the audio clip">⬇ Save audio as</button>
    <select id="pv-fmt" style="padding:4px 6px">
      <option value="mp3">mp3</option><option value="m4a">m4a</option>
      <option value="wav">wav</option><option value="ogg">ogg</option>
    </select>
    <span class="meta" id="pv-meta"></span>
    <span class="spacer"></span>
    <span class="meta">click card or press Space to flip</span>
  </div>
  <div class="cardbox" id="pv-card"></div>
  <div id="pv-edit" style="display:none;max-width:640px;margin:10px auto 0">
    <textarea id="pv-note" rows="4" style="width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:13px;padding:8px" placeholder="explanation — appears on the card back when exported"></textarea>
    <div class="row" style="justify-content:center;margin-top:8px">
      <button class="primary" id="pv-save-note">Save explanation</button>
      <button id="pv-ai-note" title="write the explanation with the configured AI API">✦ AI</button>
      <button id="pv-tpl-note" title="start from the block's template">Template</button>
      <span class="meta" id="pv-note-msg"></span>
    </div>
  </div>
  <div class="note">editor info only — not part of the card</div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
const es = (s) => document.createElement(s);
let VIEW = 'stats';
let BROWSE = { page: 1, q: '', source: 0, level: '', status: '', sort: 'len' };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}
const esc = (s) => (s || '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- stats ---------- */
async function showStats() {
  const d = await api('/api/stats');
  const s = d.stats;
  $('#view').innerHTML = '';
  const h = es('div'); h.innerHTML = '<h2>Statistics</h2>'; $('#view').append(h);
  const k = es('div'); k.className = 'kpis';
  k.innerHTML =
    `<div class="kpi"><b>${s.total.toLocaleString()}</b><span>sentences indexed</span></div>` +
    `<div class="kpi"><b>${s.kept.toLocaleString()}</b><span>kept after quality rules</span></div>` +
    `<div class="kpi"><b>${s.approved.toLocaleString()}</b><span>approved</span></div>` +
    `<div class="kpi"><b>${s.discarded.toLocaleString()}</b><span>discarded</span></div>` +
    `<div class="kpi"><b>${s.sources}</b><span>sources</span></div>`;
  $('#view').append(k);
  if (s.per_source.length) {
    const t = es('table');
    t.innerHTML = '<tr><th>source</th><th>kind</th><th>sentences</th><th>kept</th>' +
      '<th style="width:140px">kept %</th><th>approved</th></tr>' +
      s.per_source.map(r => {
        const pct = r.sentences ? Math.round(100 * (r.kept || 0) / r.sentences) : 0;
        return `<tr><td>${esc(r.name)}</td><td class="dim">${esc(r.kind)}</td>` +
          `<td>${(r.sentences || 0).toLocaleString()}</td>` +
          `<td>${(r.kept || 0).toLocaleString()}</td>` +
          `<td><div class="bar ${pct > 80 ? 'g' : ''}"><i style="width:${pct}%"></i></div></td>` +
          `<td>${r.approved || 0}</td></tr>`;
      }).join('');
    $('#view').append(t);
  }
  if (s.length_hist.length) {
    const max = Math.max(...s.length_hist.map(b => b.c));
    const t = es('table'); t.style.marginTop = '18px';
    t.innerHTML = '<tr><th>length (chars)</th><th>count</th></tr>' +
      s.length_hist.map(b =>
        `<tr><td>${b.bucket}–${b.bucket + 9}</td>` +
        `<td style="width:60%"><div class="bar"><i style="width:${100 * b.c / max}%"></i></div></td>` +
        `<td class="dim">${b.c.toLocaleString()}</td></tr>`).join('');
    $('#view').append(t);
  }
}

/* ---------- browse ---------- */
async function showBrowse() {
  const d0 = await api('/api/stats');
  $('#view').innerHTML = '';
  const h = es('div');
  h.innerHTML = '<h2>Card browser</h2>';
  $('#view').append(h);
  const bar = es('div'); bar.className = 'row';
  const srcOpts = '<option value="0">all sources</option>' +
    d0.sources.map(s => `<option value="${s.id}"${s.id == BROWSE.source ? ' selected' : ''}>${esc(s.name)}</option>`).join('');
  const levOpts = '<option value="">any level</option>' +
    (d0.lexicons[0] ? JSON.parse(d0.lexicons[0].level_order || '[]')
      .map(l => `<option${l === BROWSE.level ? ' selected' : ''}>${esc(l)}</option>`).join('') : '');
  bar.innerHTML =
    `<input id="bq" placeholder="text search…" value="${esc(BROWSE.q)}" style="min-width:180px">` +
    `<select id="bsrc">${srcOpts}</select>` +
    `<select id="blev">${levOpts}</select>` +
    `<select id="bstat">
      <option value="">any status</option>
      <option value="pending"${BROWSE.status === 'pending' ? ' selected' : ''}>pending</option>
      <option value="approved"${BROWSE.status === 'approved' ? ' selected' : ''}>approved</option>
      <option value="discarded"${BROWSE.status === 'discarded' ? ' selected' : ''}>discarded</option>
    </select>` +
    `<select id="bsort">
      <option value="len"${BROWSE.sort === 'len' ? ' selected' : ''}>shortest first</option>
      <option value="len_desc"${BROWSE.sort === 'len_desc' ? ' selected' : ''}>longest first</option>
      <option value="source"${BROWSE.sort === 'source' ? ' selected' : ''}>by source</option>
      <option value="recent"${BROWSE.sort === 'recent' ? ' selected' : ''}>newest</option>
    </select>` +
    `<button class="primary" id="bgo">Filter</button>` +
    `<button class="ok" id="bappr">✓ Approve selected</button>` +
    `<button class="no" id="bdisc">✕ Discard selected</button>`;
  $('#view').append(bar);
  const t = es('table'); t.id = 'btable';
  $('#view').append(t);
  const pager = es('div'); pager.className = 'pager'; pager.id = 'bpager';
  $('#view').append(pager);
  const run = async () => {
    BROWSE.q = $('#bq').value; BROWSE.source = +$('#bsrc').value;
    BROWSE.level = $('#blev').value; BROWSE.status = $('#bstat').value;
    BROWSE.sort = $('#bsort').value;
    await loadPage(1);
  };
  $('#bgo').onclick = run;
  $('#bq').onkeydown = e => { if (e.key === 'Enter') run(); };
  $('#bappr').onclick = () => bulk('approved');
  $('#bdisc').onclick = () => bulk('discarded');
  await loadPage(BROWSE.page);
}

async function loadPage(p) {
  BROWSE.page = p;
  const p2 = new URLSearchParams({ q: BROWSE.q, source: BROWSE.source,
    level: BROWSE.level, status: BROWSE.status, sort: BROWSE.sort,
    page: p, per: 50 });
  const d = await api('/api/sentences?' + p2);
  const t = $('#btable');
  t.innerHTML = '<tr><th></th><th>sentence</th><th>source</th><th>info</th><th>len</th>' +
    '<th>status</th><th>actions</th></tr>' +
    (d.rows.length ? d.rows.map(r => browseRow(r)).join('')
      : `<tr><td colspan="7" class="dim" style="text-align:center;padding:20px">
         no sentences — import a deck in Sources</td></tr>`);
  const byId = Object.fromEntries(d.rows.map(r => [r.id, r]));
  for (const tr of t.querySelectorAll('tr[data-pv]')) {
    tr.onclick = (ev) => {
      if (ev.target.closest('button, input, label, a')) return;
      openPreview(byId[+tr.dataset.pv]);
    };
  }
  for (const b of t.querySelectorAll('button[data-dec]')) {
    b.onclick = async () => {
      await api('/api/decide', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ ids: [+b.dataset.id], decision: b.dataset.dec }) });
      loadPage(BROWSE.page);
    };
  }
  const pages = Math.max(1, Math.ceil(d.total / d.per));
  $('#bpager').innerHTML =
    `<span class="dim">${d.total.toLocaleString()} sentences · page ${p}/${pages}</span>` +
    (pages > 1
      ? `<input id="pgoto" type="number" min="1" max="${pages}" value="${p}"` +
        ` style="width:72px" title="page number"> <button id="pgobtn">Go</button>`
      : '') +
    (p > 1 ? `<button id="pprev">← prev</button>` : '') +
    (p < pages ? `<button id="pnext">next →</button>` : '');
  const go = (v) => {
    const n = Math.max(1, Math.min(pages, parseInt(v, 10) || 1));
    if (n !== p) loadPage(n);
  };
  if ($('#pgobtn')) {
    $('#pgobtn').onclick = () => go($('#pgoto').value);
    $('#pgoto').onkeydown = (e) => { if (e.key === 'Enter') go($('#pgoto').value); };
  }
  if ($('#pprev')) $('#pprev').onclick = () => loadPage(p - 1);
  if ($('#pnext')) $('#pnext').onclick = () => loadPage(p + 1);
}

function browseRow(r) {
  const badge = r.decision === 'approved' ? '<span class="badge appr">approved</span>'
    : r.decision === 'discarded' ? '<span class="badge disc">discarded</span>'
    : r.keep ? '' : `<span class="badge drop">dropped ${r.drop_code || ''}</span>`;
  const flags = (r.flags || '').split(',').filter(Boolean);
  const info = (r.media_image ? '🖼' : '') + (r.media_audio ? '♪' : '') +
    (flags.length ? ` <span class="badge">${esc(flags.join(' '))}</span>` : '');
  return `<tr data-pv="${r.id}" title="click to preview as an Anki card">
    <td><input type="checkbox" class="check" data-id="${r.id}"></td>
    <td><div class="jp">${esc(r.text)}</div>
        ${r.translation ? `<div class="dim">${esc(r.translation.slice(0, 80))}</div>` : ''}</td>
    <td class="dim">${esc(r.source_name)}</td>
    <td class="dim">${info}</td>
    <td class="dim">${r.char_len}</td>
    <td>${badge}</td>
    <td>${r.keep ? `<button class="ok" data-dec="approved" data-id="${r.id}">✓</button>
        <button class="no" data-dec="discarded" data-id="${r.id}">✕</button>` : ''}</td>
  </tr>`;
}

async function bulk(decision) {
  const ids = [...document.querySelectorAll('.check:checked')].map(c => +c.dataset.id);
  if (!ids.length) return;
  await api('/api/decide', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ ids, decision }) });
  loadPage(BROWSE.page);
}

/* ---------- sources / lexicons ---------- */
async function showSources() {
  const d = await api('/api/stats');
  $('#view').innerHTML = '';
  const h = es('div'); h.innerHTML = '<h2>Sources</h2>'; $('#view').append(h);
  const f = es('div'); f.className = 'box';
  f.innerHTML =
    '<h2 style="font-size:15px">Import Anki deck (.apkg)</h2>' +
    pickHTML('ifile', 'deck file', '.apkg') +
    '<label>max characters per sentence</label><input id="imax" type="number" value="60">' +
    '<button class="primary" id="igo" style="margin-top:12px">Import</button>' +
    '<div id="msg"></div>';

    'the chosen audio track and frame images are kept, the video itself is not stored.</p>' +
    '<div id="vopts"></div>' +
    '<label>global offset, seconds (+ later, − earlier) — e.g. the drift measured for this release</label>' +
    '<input id="vo" type="number" step="0.05" value="0">' +
    '<div class="row" style="margin:0">' +
    '<label style="margin:0">lead pad (s)<input id="vps" type="number" step="0.05" min="0" max="5" value="0.35" style="width:80px"></label>' +
    '<label style="margin:0">tail pad (s)<input id="vpe" type="number" step="0.05" min="0" max="5" value="0.35" style="width:80px"></label>' +
    '</div>' +
    '<p class="hint">audio clips are cut on demand with these settings — they stay editable on ' +
    'the source below (where Whisper can also measure the offset for you).</p>' +
    '<button class="primary" id="vgo" style="margin-top:12px">Import</button>' +
    '<div id="vmsg" class="dim" style="margin-top:8px"></div>';
  $('#view').append(vf);
  const streamLabel = (s) =>
    `#${s.aindex}${s.lang ? ' · ' + s.lang : ''}${s.title ? ' · ' + s.title.slice(0, 24) : ''}` +
    ` · ${s.codec} ${s.channels}ch`;
  let VS = null;                    // staged-import state between clicks
  const vReset = () => {
    VS = null; $('#vopts').innerHTML = '';
    $('#vgo').textContent = 'Import';
  };
  $('#vv').addEventListener('change', vReset);
  $('#vs').addEventListener('change', vReset);
  $('#vgo').onclick = async () => {
    const vfile = $('#vv').files[0], sfile = $('#vs').files[0];
    if (!vfile || !sfile) {
      $('#vmsg').textContent = 'choose both the video and the subtitles file'; return;
    }
    const btn = $('#vgo');

    try {
      VS = VS || {};
      if (!VS.subs) {
        $('#vmsg').textContent = 'uploading subtitles…';
        VS.subs = await uploadFile(sfile);
        VS.subInfo = await api('/api/analyze-subs', { method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ path: VS.subs.path }) });
      }
      if (VS.subInfo.bilingual && !VS.langDone) {
        const jaShare = Math.round(100 * VS.subInfo.kana_lines /
                                   Math.max(1, VS.subInfo.total));
        $('#vopts').innerHTML =
          '<label>these subtitles carry two languages (Japanese + Chinese) — language to keep</label>' +
          '<select id="vlang">' +
          `<option value="ja"${jaShare >= 50 ? ' selected' : ''}>Japanese (the kana lines)</option>` +
          `<option value="zh"${jaShare < 50 ? ' selected' : ''}>Chinese</option>` +
          '<option value="">keep everything</option></select>';
        btn.textContent = 'Continue →';
        VS.langDone = true;
        $('#vmsg').textContent =
          `two languages detected (${VS.subInfo.total} cues, ` +
          `${jaShare}% Japanese) — pick what to keep, then Continue`;
        return;
      }
      if (!VS.video) {
        const vup = await uploadFile(vfile, (l, t) => {
          $('#vmsg').textContent =
            `reading video… ${Math.round(100 * l / t)}% of ${fmtSize(t)}`;
        }, true);
        const probe = await api('/api/probe-video', { method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ path: vup.path }) });
        VS.video = vup;               // only committed once the probe worked
        VS.probe = probe;
      }
      if (!VS.ready) {
        if (VS.probe.streams.length > 1) {
          $('#vopts').insertAdjacentHTML('beforeend',
            '<label>audio track in this video</label><select id="vtrack">' +
            VS.probe.streams.map(s =>
              `<option value="${s.aindex}"${s.aindex === VS.probe.default ? ' selected' : ''}>` +
              `${esc(streamLabel(s))}</option>`).join('') +
            '</select>');

        $('#vopts').insertAdjacentHTML('beforeend',
          '<div class="row" style="margin-top:10px">' +
          '<button type="button" class="pdet" title="transcribe a few cues from the picked audio track and measure the subtitle drift">✦ Detect shift now</button>' +
          '<span class="pdres dim"></span></div>');
        const pdet = $('#vopts .pdet'), pres = $('#vopts .pdres');
        const pdetRun = () => runDetect(pres, '/api/whisper/pre',
          { video: VS.video.path, subs: VS.subs.path,
            astream: $('#vtrack') ? +$('#vtrack').value : null,
            sub_lang: $('#vlang') ? $('#vlang').value : 'auto' },
          (r) => () => {
            $('#vo').value = r.median;
            pres.textContent = r.split
              ? `offset ${r.median}s set — import, then add the segment ` +
                `(+${r.split.shift}s from ${r.split.at}s) in this source's box`
              : `offset set to ${r.median}s ✓ — now Import`;
          });
        pdet.onclick = async () => {
          pdet.disabled = true;
          try { await pdetRun(); }
          catch (e) { whisperFail(pres, e, () => { pdet.disabled = false; pdetRun(); }); }
          finally { pdet.disabled = false; }
        };
        btn.textContent = 'Import';
        VS.ready = true;
        $('#vmsg').textContent =
          'ready to import — ✦ detect the shift now (recommended: frame images are timed with this offset), then Import';
        return;

      const langSel = $('#vlang'), trackSel = $('#vtrack');
      $('#vmsg').textContent =
        'importing: extracting the audio track and grabbing frame images — this can take a minute or two…';
      const r = await api('/api/import/video', { method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ video: VS.video.path, subs: VS.subs.path,
                               offset: +$('#vo').value || 0,
                               pad_start: +$('#vps').value || 0,
                               pad_end: +$('#vpe').value || 0,
                               name: VS.video.name.replace(/\.[^.]+$/, ''),
                               astream: trackSel ? +trackSel.value : null,
                               sub_lang: langSel ? langSel.value : 'auto' }) });
      $('#vmsg').textContent =
        `imported: ${r.cues} cues, ${r.kept} kept, ${r.frames} frames · audio ${r.audio_track}` +
        (r.sub_lang ? ` · subtitles kept ${r.sub_lang === 'ja' ? 'Japanese' : 'Chinese'}` : '');
      setTimeout(showSources, 1800);
    } catch (e) {

    }
  };
  if (d.sources.length) {

    $('#view').append(t);

        'padding:0 0 2px;margin:0 0 10px;width:100%;color:var(--ink)">' +
        '<div class="row" style="margin-bottom:6px">' +
        '<label style="margin:0">offset (s)<input class="voff" type="number" step="0.05" style="width:90px"></label>' +
        '<label style="margin:0">lead pad (s)<input class="vps" type="number" step="0.05" min="0" max="5" style="width:80px"></label>' +
        '<label style="margin:0">tail pad (s)<input class="vpe" type="number" step="0.05" min="0" max="5" style="width:80px"></label>' +
        '</div>' +
        '<p class="hint">cue times are originals — shifts apply when audio is cut. ' +
        'Each segment = "from this cue time on, the TOTAL shift is X seconds".<br>' +
        'audio clips are cut fresh from the stored full-length track on every preview ' +
        'and export — changing anything here is always exact. Frame images, however, ' +
        'are grabbed once at import: for perfectly timed frames, run ✦ Detect in the ' +
        'import form before importing.</p>' +
        '<div class="segs"></div>' +
        '<div class="row" style="margin-top:8px">' +
        '<button class="addseg">+ segment</button>' +
        '<button class="primary save">Save</button>' +
        '<button class="wsp" title="transcribe a few cues with Whisper and estimate the global shift">✦ Detect shift</button>' +
        `<a class="btn" href="/api/video/${v.id}/subs" download title="the original subtitle file with this source's offset and segments applied">⤓ Fixed subtitles</a>` +
        '<span class="msg dim"></span></div>' +
        '<div class="wsres dim" style="margin-top:6px"></div>';
      $('#view').append(box);

}

async function loadShift(box, sid) {
  const meta = await api(`/api/video/${sid}`);
  box.querySelector('.voff').value = meta.offset || 0;
  box.querySelector('.vps').value = meta.pad_start != null ? meta.pad_start
    : (meta.pad != null ? meta.pad : 0.35);
  box.querySelector('.vpe').value = meta.pad_end != null ? meta.pad_end
    : (meta.pad != null ? meta.pad : 0.35);
  const segs = box.querySelector('.segs');
  const addSeg = (at = '', shift = '') => {
    const r = es('div'); r.className = 'row'; r.style.marginTop = '6px';
    r.innerHTML = `from cue time (s) <input class="at" type="number" step="0.1" value="${at}" style="width:90px">` +
      `total shift (s) <input class="sh" type="number" step="0.1" value="${shift}" style="width:90px">` +
      '<button class="rm">✕</button>';
    r.querySelector('.rm').onclick = () => r.remove();
    segs.appendChild(r);
  };
  for (const g of (meta.segments || [])) addSeg(g.at, g.shift);
  box.querySelector('.addseg').onclick = () => addSeg();
  const save = async () => {
    const segments = [...segs.querySelectorAll('.row')].map(r => ({
      at: +r.querySelector('.at').value || 0,
      shift: +r.querySelector('.sh').value || 0 }));
    const r = await api(`/api/video/${sid}/shift`, { method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ offset: +box.querySelector('.voff').value || 0,
                             segments,
                             pad_start: +box.querySelector('.vps').value || 0,
                             pad_end: +box.querySelector('.vpe').value || 0,
                             name: box.querySelector('.sname').value }) });
    box.querySelector('.msg').textContent = 'saved ✓';
    return r;
  };
  box.querySelector('.save').onclick = save;
  // Whisper-based global-shift detection (analysis only; Apply writes it)
  const wsp = box.querySelector('.wsp'), wres = box.querySelector('.wsres');
  const addSegEl = addSeg;                       // segment editor in scope
  const wspRun = () => runDetect(wres, `/api/video/${sid}/whisper`, {},
    (r) => async () => {
      box.querySelector('.voff').value = r.median;
      if (r.split) addSegEl(r.split.at, r.split.shift);
      await save();
      wres.textContent = `offset ${r.median}s` +
        (r.split ? ` + segment ${r.split.shift}s from ${r.split.at}s` : '') +
        ' applied ✓';
    });
  wsp.onclick = async () => {
    wsp.disabled = true;
    try { await wspRun(); }
    catch (e) { whisperFail(wres, e, () => { wsp.disabled = false; wspRun(); }); }
    finally { wsp.disabled = false; }
  };
}

const THEME_KEY = 'asTheme';
function applyTheme(pref) {
  const eff = pref === 'auto'
    ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : pref;
  const root = document.documentElement;
  for (const c of ['dark', 'nord', 'solar'])
    root.classList.remove(c);
  if (eff !== 'light') root.classList.add(eff);
  localStorage.setItem(THEME_KEY, pref);
  const sel = $('#themeSel');
  if (sel) sel.value = pref;
}
$('#themeSel').onchange = () => applyTheme($('#themeSel').value);
applyTheme(localStorage.getItem(THEME_KEY) || 'auto');

/* ---------- Anki-style card preview ---------- */
let PV = { row: null, back: false, edit: null };   // edit: {item_id, point, template}
function openPreview(row, edit = null) {
  PV = { row, back: false, edit };
  $('#preview').classList.add('open');
  const ed = document.getElementById('pv-edit');
  ed.style.display = edit ? '' : 'none';
  if (edit) {
    document.getElementById('pv-note').value = row.note || '';
    document.getElementById('pv-note-msg').textContent = '';
    document.getElementById('pv-tpl-note').style.display =
      (edit.template || '').includes('{') ? '' : 'none';
  }
  renderPreview();
}
function closePreview() {
  $('#preview').classList.remove('open');
  PV = { row: null, back: false, edit: null };
  document.getElementById('pv-edit').style.display = 'none';
}
function renderPreview() {
  const r = PV.row;
  if (!r) return;
  $('#pv-meta').textContent =
    `${r.source_name}${r.episode ? ' · ep ' + r.episode : ''} · ${r.char_len} chars` +
    (PV.edit ? ` · ${PV.edit.point || 'no block'}` : '') +
    (r.drop_code ? ` · ⚠ dropped (${r.drop_code})` : '') +
    (r.decision === 'approved' ? ' · ✓ approved' :
     r.decision === 'discarded' ? ' · ✕ discarded' : '');
  $('#pv-flip').textContent = PV.back ? 'Show front' : 'Show back';
  const img = r.media_image
    ? `<img src="/api/media/${r.id}/image?v=${r.id}" alt="">` : '';
  const au = r.media_audio
    ? `<audio controls preload="none" src="/api/media/${r.id}/audio?v=${r.id}"></audio>` : '';
  const back = PV.back
    ? `${r.reading ? `<div class="rd">${esc(r.reading)}</div>` : ''}` +
      `${r.translation ? `<div class="tr">${esc(r.translation)}</div>` : ''}` +
      `${r.note ? `<div class="ex">${esc(r.note)}</div>` : ''}` : '';
  $('#pv-card').innerHTML =
    `<div class="front-label">${PV.back ? 'Back' : 'Front'}</div>` +
    img + au +
    `<div class="jp">${esc(r.text)}</div>` + back;
}
$('#pv-close').onclick = closePreview;

function uploadFile(file, onprog, temp) {
  return new Promise((res, rej) => {
    const fd = new FormData();
    fd.append('file', file, file.name);
    const x = new XMLHttpRequest();
    x.open('POST', '/api/upload' + (temp ? '?temp=1' : ''));
    x.upload.onprogress = (e) => {
      if (e.lengthComputable && onprog) onprog(e.loaded, e.total);
    };
    x.onload = () => {
      try {
        const d = JSON.parse(x.responseText);
        (x.status >= 200 && x.status < 300) ? res(d)
          : rej(new Error(d.detail || 'upload failed (' + x.status + ')'));
      } catch { rej(new Error('upload failed (' + x.status + ')')); }
    };
    x.onerror = () => rej(new Error('upload failed — is the server running?'));
    x.send(fd);
  });
}

/* Whisper detection: server streams one JSON line per measured cue */
async function apiStream(path, body, onEvent) {
  const resp = await fetch(path, { method: 'POST',
    headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if (!resp.ok) throw new Error((await resp.json().catch(() => ({}))).detail || resp.status);
  const reader = resp.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const lines = buf.split('\n'); buf = lines.pop();
    for (const ln of lines) if (ln.trim()) onEvent(JSON.parse(ln));
  }
}

function renderDetectResult(el, r, onApply) {
  if (r.median == null) {
    const heard = r.samples.slice(0, 2).map(s => s.heard)
      .filter(Boolean).join(' / ');
    el.textContent = `couldn't measure — ${r.matched}/${r.total} cues matched` +
      (heard ? ` (whisper heard: «${heard}»)` : '');
    return;
  }
  el.innerHTML = '';
  const t = es('span');
  t.textContent = `detected ${r.median >= 0 ? '+' : ''}${r.median}s ` +
    `(${r.matched}/${r.total} cues${r.consistent ? '' : ' ⚠ cues disagree'})` +
    (r.split ? ` · drift changes to ${r.split.shift >= 0 ? '+' : ''}${r.split.shift}s at ${r.split.at}s` : '') + ' ';
  const apply = es('button');
  apply.textContent = r.split ? 'Apply both' : `Use ${r.median >= 0 ? '+' : ''}${r.median}s`;
  apply.onclick = onApply(r);
  el.append(t, apply);
}

async function runDetect(el, url, body, onApply) {
  let n = 0, matched = 0;
  el.innerHTML = '';
  el.textContent = 'measuring the first cue…';
  let final = null, failed = null;
  await apiStream(url, body, (ev) => {
    if (ev.sample) {
      n++;
      if (ev.sample.offset != null) matched++;
      const last = ev.sample.offset != null
        ? `${ev.sample.offset >= 0 ? '+' : ''}${ev.sample.offset}s` : 'no match';
      el.textContent = `measuring… ${n} done · ${matched} matched · last: ${last}`;
    } else if (ev.result) {
      final = ev.result;
    } else if (ev.error) {
      failed = ev.error;
    }
  });
  if (failed) throw new Error(failed);
  if (final) renderDetectResult(el, final, onApply);
}

function whisperFail(el, e, retry) {
  if (!/not installed/i.test(e.message)) {
    el.textContent = 'error: ' + e.message;
    return;
  }
  el.innerHTML = '';
  const t = es('span');
  t.textContent = 'whisper is not installed on this machine. ';
  const inst = es('button');
  inst.textContent = 'Install Whisper';
  inst.title = 'creates a small dedicated venv (.venv-whisper) via uv — downloads Python 3.11 + torch + whisper once';
  inst.onclick = async () => {
    inst.disabled = true;
    el.textContent = 'installing whisper — this can take several minutes (Python + torch are downloaded once)…';
    try {
      await api('/api/whisper/install', { method: 'POST',
        headers: {'Content-Type':'application/json'}, body: '{}' });
      el.textContent = 'whisper installed ✓';
      retry();
    } catch (err) {
      el.textContent = 'error: ' + err.message;
      inst.disabled = false;
    }
  };
  el.append(t, inst);
}

    $('#rv-later').onclick = () => rvDecide('skip');
    $('#rv-move').onclick = rvMoveTo;
    $('#rv-no').onclick = () => rvDecide('no');
    rvShow();
  };
}

function rvShow() {
  if (RV.i >= RV.pool.length) { rvFinish(); return; }
  const undoBtn = $('#rv-undo');
  if (undoBtn) undoBtn.style.display = RV.i > 0 ? '' : 'none';
  const r = RV.pool[RV.i];
  const prog = $('#rv-progress');
  prog.innerHTML = RV.pool.map((_, i) => {
    const st = RV.done[i];
    return `<i class="${st === 'ok' ? 'ok' : st === 'no' ? 'no' : ''}"></i>`;
  }).join('');
  const img = r.media_image
    ? `<img src="/api/media/${r.id}/image?v=${r.id}" loading="eager" alt="">` : '';
  const au = r.media_audio
    ? `<audio controls autoplay preload="auto" src="/api/media/${r.id}/audio?v=${r.id}"></audio>` : '';
  $('#rv-card').innerHTML = img + au +
    `<div class="jp">${esc(r.text)}</div>` +
    (r.reading ? `<div class="rd">${esc(r.reading)}</div>` : '') +
    (r.translation ? `<div class="tr">${esc(r.translation)}</div>` : '');
  $('#rv-meta').textContent =
    `${RV.i + 1}/${RV.pool.length} · ${r.source_name}${r.episode ? ' · ep ' + r.episode : ''}` +
    ` · ${r.char_len} chars · ${r.level || '—'} · ${RV.point || 'no label'}`;
  // warm the next card's media (video sources cut audio on demand — the
  // first play would otherwise stall the review rhythm)
  const nx = RV.pool[RV.i + 1];
  if (nx) {
    if (nx.media_image) { const im = new Image(); im.src = `/api/media/${nx.id}/image?v=${nx.id}`; }
    if (nx.media_audio) { const a = new Audio(`/api/media/${nx.id}/audio?v=${nx.id}`); a.preload = 'auto'; a.load(); }
  }
}

let RVBUSY = false;   // one decision at a time — fast keypresses used to
                      // double-approve a card and skip the next one

async function rvDecide(kind) {
  if (RVBUSY || RV.i >= RV.pool.length) return;
  RVBUSY = true;
  const r = RV.pool[RV.i];
  try {
    const ctx = RV.point ? 'point:' + RV.point : 'global';
    if (kind === 'ok') {
      await api('/api/pool-decide', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sentence_id: r.id, context: ctx, decision: 'approved' }) });
      await api('/api/deck/add', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sentence_id: r.id, point: RV.point || '' }) });
    } else if (kind === 'no') {
      await api('/api/pool-decide', { method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sentence_id: r.id, context: ctx, decision: 'discarded' }) });
    }
    RV.done[RV.i] = kind === 'ok' ? 'ok' : kind === 'no' ? 'no' : '';
    RV.counts[kind] = (RV.counts[kind] || 0) + 1;
    RV.i += 1;
    rvShow();
  } catch (e) {
    const meta = $('#rv-meta');
    if (meta) meta.textContent = `⚠ saving failed (${e.message}) — nothing was recorded, try again`;
  } finally {
    RVBUSY = false;
  }
}

async function rvMoveTo() {
  if (RVBUSY || RV.i >= RV.pool.length) return;
  const r = RV.pool[RV.i];
  ptOpen(async (newPoint) => {
    RVBUSY = true;
    try {
      await api('/api/pool-decide', { method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sentence_id: r.id,
          context: 'point:' + newPoint, decision: 'approved' }) });
      await api('/api/deck/add', { method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ sentence_id: r.id, point: newPoint }) });
      RV.done[RV.i] = 'ok';
      RV.counts.ok = (RV.counts.ok || 0) + 1;
      RV.i += 1;
      rvShow();
    } catch (e) {
      const meta = $('#rv-meta');
      if (meta) meta.textContent = `⚠ move failed (${e.message}) — nothing was recorded`;
    } finally {
      RVBUSY = false;
    }
  }, RV.point);
}

async function rvUndo() {
  if (RVBUSY || RV.i === 0) return;
  RVBUSY = true;
  try {
    RV.i--;
    const r = RV.pool[RV.i];
    const prev = RV.done[RV.i];
    const ctx = RV.point ? 'point:' + RV.point : 'global';
    await api('/api/pool-decide', { method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ sentence_id: r.id, context: ctx, decision: '' }) });
    if (prev === 'ok') {
      const deck = await api('/api/deck');
      const match = deck.items.find(it => it.sentence_id === r.id);
      if (match) {
        await api('/api/deck/' + match.id, { method: 'DELETE' });
      }
      RV.counts.ok = Math.max(0, RV.counts.ok - 1);
    } else if (prev === 'no') {
      RV.counts.no = Math.max(0, RV.counts.no - 1);
    } else {
      RV.counts.skip = Math.max(0, RV.counts.skip - 1);
    }
    RV.done[RV.i] = undefined;
    rvShow();
  } catch (e) {
    const meta = $('#rv-meta');
    if (meta) meta.textContent = `⚠ undo failed (${e.message})`;
  } finally {
    RVBUSY = false;
  }
}

function rvFinish() {
  $('#rv-card').innerHTML =
    `<div style="padding:30px 0"><b style="font-size:22px">Pool done</b><br>` +
    `<span class="dim">approved ${RV.counts.ok} · rejected ${RV.counts.no} · later ${RV.counts.skip}</span></div>`;
  $('#rv-meta').textContent = 'approved cards are in the Deck view, ordered under their point';
  $('#rv-progress').innerHTML = '';
}

document.addEventListener('keydown', (e) => {
  if (!document.getElementById('rv-card')) return;
  if (document.activeElement.tagName === 'INPUT' ||
      document.activeElement.tagName === 'TEXTAREA' ||
      document.activeElement.tagName === 'SELECT') return;
  if (window.getSelection && String(window.getSelection())) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') {
    const a = document.querySelector('#rv-card audio');
    if (a) { a.currentTime = 0; a.play(); }
    e.preventDefault();
  } else if (k === 'a' || e.key === 'ArrowRight') { e.preventDefault(); rvDecide('ok'); }
  else if (k === 'x') { rvDecide('no'); }
  else if (k === 's' || e.key === 'ArrowLeft') { e.preventDefault(); rvDecide('skip'); }
  else if (k === 'z') { rvUndo(); }
  else if (k === 'm') { rvMoveTo(); }
});

/* ---------- deck workbench (redactor) ---------- */
async function showDeck() {
  const d = await api('/api/deck');
  $('#view').innerHTML = '';
  const h = es('div'); h.innerHTML = '<h2>Deck</h2>'; $('#view').append(h);
  const pts = Object.fromEntries(d.points.map(p => [p.id, p]));
  if (!d.items.length) {
    const p = es('p'); p.className = 'dim';
    p.textContent = 'The deck is empty — approve cards in Batch review and they land here, grouped by grammar point.';
    $('#view').append(p);
    return;
  }
  const groups = {};
  for (const it of d.items) (groups[it.point || '· no point ·'] =
    groups[it.point || '· no point ·'] || []).push(it);
  for (const [point, items] of Object.entries(groups)) {
    const pt = pts[point] || {};
    const shows = {};
    for (const it of items) shows[it.source_name] = (shows[it.source_name] || 0) + 1;
    const g = es('div'); g.className = 'deckgroup';
    g.innerHTML =
      `<h3>${esc(point)}<span class="balance">${items.length} cards · ` +
      Object.entries(shows).map(([k, v]) => `${esc(k)}×${v}`).join(' · ') +
      '</span></h3>' +
      '<div class="row" style="margin-bottom:8px;flex-wrap:wrap">' +
      '<input class="instr" placeholder="AI instruction, e.g. make this explanation more example specific" style="flex:1;min-width:220px">' +
      '<button class="tpl-toggle">Template…</button>' +
      '<button class="tpl-apply">Apply template to empty</button>' +
      '<button class="ai-block" title="explain every card without a note in one API call">✦ AI: fill empty notes</button>' +
      '<span class="bmsg dim"></span></div>' +
      '<div class="tpl-box" style="display:none">' +
      '<label style="font-size:12px;color:var(--muted)">per-card template — placeholders: {sentence} {reading} {translation} {title} {pattern} {level} {source} {episode}</label>' +
      '<textarea class="tpl" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:12.5px" ' +
      'placeholder="e.g. {pattern} — how it works in this sentence…"></textarea>' +
      '<div class="row" style="margin-top:6px"><button class="tpl-save primary">Save template</button>' +
      '<span class="hint">apply it with the “Apply template to empty” button above</span></div>' +
      '<label style="font-size:12px;color:var(--muted);margin-top:12px">block boilerplate — same text on every card of this block, prepended before per-card notes</label>' +
      '<textarea class="bp" rows="3" style="width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:12.5px" ' +
      'placeholder="e.g. What ている is, in general — identical on every card of this block."></textarea>' +
      '<div class="row" style="margin-top:6px"><button class="bp-save primary">Save boilerplate</button>' +
      '<button class="bp-apply">Add boilerplate to all cards</button>' +
      '<span class="hint">idempotent — cards that already have it are skipped</span></div></div>';
    $('#view').append(g);
    const tplBox = g.querySelector('.tpl-box'),
          tpl = g.querySelector('.tpl'), bmsg = g.querySelector('.bmsg');
    const bp = g.querySelector('.bp');
    tpl.value = pt.template || '';
    bp.value = pt.boilerplate || '';
    g.querySelector('.tpl-toggle').onclick = () => {
      tplBox.style.display = tplBox.style.display === 'none' ? '' : 'none';
    };
    g.querySelector('.tpl-save').onclick = async () => {
      await api('/api/point/' + encodeURIComponent(point), { method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ template: tpl.value }) });
      bmsg.textContent = 'template saved ✓';
    };
    g.querySelector('.bp-save').onclick = async () => {
      await api('/api/point/' + encodeURIComponent(point), { method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ boilerplate: bp.value }) });
      bmsg.textContent = 'boilerplate saved ✓';
    };
    g.querySelector('.bp-apply').onclick = async () => {
      bmsg.textContent = 'adding boilerplate…';
      try {
        const r = await api('/api/boilerplate-apply', { method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ point }) });
        bmsg.textContent = r.updated
          ? `boilerplate added to ${r.updated} of ${r.total} cards ✓ (rest already had it)`
          : `all ${r.total} cards already have it`;
        if (r.updated) showDeck();
      } catch (e) { bmsg.textContent = 'error: ' + e.message; }
    };
    g.querySelector('.tpl-apply').onclick = async () => {
      bmsg.textContent = 'filling…';
      try {
        const r = await api('/api/template-apply', { method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ point }) });
        bmsg.textContent = `filled ${r.filled} of ${r.total} cards ✓`;
        if (r.filled) showDeck();
      } catch (e) { bmsg.textContent = 'error: ' + e.message; }
    };
    g.querySelector('.ai-block').onclick = async (ev) => {
      const btn = ev.target.closest('button');
      btn.disabled = true;
      bmsg.textContent = 'asking the API about the whole block…';
      try {
        const r = await api('/api/ai/fill-block', { method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ point,
            instruction: g.querySelector('.instr').value }) });
        bmsg.textContent = r.updated
          ? `✦ explained ${r.updated} of ${r.cards} cards` : r.message;
        if (r.updated) showDeck();
      } catch (e) { bmsg.textContent = 'error: ' + e.message; }
      btn.disabled = false;
    };
    items.forEach((it, idx) => {
      const row = es('div'); row.className = 'drow'; row.style.cursor = 'pointer';
      row.innerHTML =
        `<div style="flex:1;min-width:0"><div class="jp">${esc(it.text)}</div>` +
        `<div class="meta">${esc(it.source_name)}${it.episode ? ' · ep ' + it.episode : ''} · ${it.char_len} chars` +
        `${it.note ? ' · ✎ explained' : ''}</div></div>` +
        '<button class="edit" title="open the card editor">✎ Edit</button>' +
        `<button class="up">↑</button><button class="dn">↓</button>` +
        `<button class="mv" title="move to another point">⇄</button>` +
        `<button class="no rm">✕</button>`;
      g.appendChild(row);
      const openCard = () => openPreview(
        { ...it, id: it.sentence_id },     // sentence id → media endpoints
        { item_id: it.id, point, template: pt.template || '',
          boilerplate: pt.boilerplate || '',
          pointInfo: { title: pt.title || '', pattern: pt.pattern || '',
                       level: pt.level || '' } });
      row.onclick = (ev) => {
        if (ev.target.closest('button, input, textarea')) return;
        openCard();
      };
      row.querySelector('.edit').onclick = openCard;
      row.querySelector('.mv').onclick = () => {
        ptOpen(async (newPoint) => {
          await api(`/api/deck/${it.id}`, { method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ point: newPoint }) });
          showDeck();
        }, it.point);
      };
      row.querySelector('.rm').onclick = async () => {
        await api(`/api/deck/${it.id}`, { method: 'DELETE' });
        showDeck();
      };
      row.querySelector('.up').onclick = () => deckMove(it, idx - 1, items);
      row.querySelector('.dn').onclick = () => deckMove(it, idx + 1, items);
    });
  }
}

async function deckMove(it, to, items) {
  if (to < 0 || to >= items.length) return;
  const other = items[to];
  await api(`/api/deck/${it.id}`, { method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ position: other.position }) });
  await api(`/api/deck/${other.id}`, { method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ position: it.position }) });
  showDeck();
}

const VIEWS = { stats: showStats, browse: showBrowse, projects: showProjects,
                points: showPoints,
                review: showReview, deck: showDeck,
                sources: showSources, lexicons: showLexicons,

    VIEW = a.dataset.view;
    for (const b of document.querySelectorAll('#side a'))
      b.classList.toggle('active', b === a);
    VIEWS[VIEW]();
  };
}
